# ============================================
# ElectroByte — Docker Compose Stack
# PostgreSQL Database Only
# ============================================

services:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: electrobyte-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: electrobyte
      POSTGRES_PASSWORD: electrobyte_admin20
      POSTGRES_DB: electrobyte
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U electrobyte -d electrobyte"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
