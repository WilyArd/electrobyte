# ============================================
# ElectroByte — Microservices Docker Compose
# ============================================

networks:
  electrobyte-net:
    driver: bridge

services:

  # ─────────────────────────────────────────────
  # 1. MinIO — Object Storage (S3-compatible)
  #    Harus pertama karena services lain bergantung padanya
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: electrobyte-minio
    restart: unless-stopped
    networks:
      - electrobyte-net
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      - MINIO_ROOT_USER=electrobyte
      - MINIO_ROOT_PASSWORD=electrobyte_secret
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # Traefik API Gateway & Reverse Proxy (Port 80)
  # ─────────────────────────────────────────────
  traefik:
    image: traefik:v3.7
    container_name: electrobyte-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "3000:80"     # Traefik HTTP Gateway on Port 3000 (Storefront & API Gateway)
      - "8085:8080"   # Traefik Dashboard (Dev only - host port 8085)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    environment:
      - DOCKER_API_VERSION=1.40
    networks:
      - electrobyte-net

  # ─────────────────────────────────────────────
  # 2. Auth Service (Port 4001)
  # ─────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/auth-service
    container_name: electrobyte-auth
    restart: unless-stopped
    networks:
      - electrobyte-net
    ports:
      - "4001:4001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4001
      # Override MinIO endpoint ke nama service Docker internal
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=electrobyte
      - MINIO_SECRET_KEY=electrobyte_secret
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=http://localhost:9000
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # Route specific auth-service Elysia endpoints (NOT NextAuth session/callback)
      - "traefik.http.routers.auth-service.rule=PathPrefix(`/api/auth/register`) || PathPrefix(`/api/auth/verify`) || PathPrefix(`/api/auth/oauth-user`) || PathPrefix(`/api/auth/user`) || PathPrefix(`/api/auth/user-by-id`) || PathPrefix(`/api/auth/profile`) || PathPrefix(`/api/user`)"
      - "traefik.http.routers.auth-service.entrypoints=web"
      - "traefik.http.routers.auth-service.priority=100"
      - "traefik.http.services.auth-service.loadbalancer.server.port=4001"

  # ─────────────────────────────────────────────
  # 3. Product Service (Port 4002)
  # ─────────────────────────────────────────────
  product-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/product-service
    container_name: electrobyte-product
    restart: unless-stopped
    networks:
      - electrobyte-net
    ports:
      - "4002:4002"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4002
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=electrobyte
      - MINIO_SECRET_KEY=electrobyte_secret
      - MINIO_USE_SSL=false
      - MINIO_PUBLIC_URL=http://localhost:9000
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4002/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.product-service.rule=PathPrefix(`/api/products`) || PathPrefix(`/api/wishlist`) || PathPrefix(`/api/reviews`)"
      - "traefik.http.routers.product-service.entrypoints=web"
      - "traefik.http.services.product-service.loadbalancer.server.port=4002"

  # ─────────────────────────────────────────────
  # 4. Cart Service (Port 4003)
  # ─────────────────────────────────────────────
  cart-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/cart-service
    container_name: electrobyte-cart
    restart: unless-stopped
    networks:
      - electrobyte-net
    ports:
      - "4003:4003"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4003
      - PRODUCT_SERVICE_URL=http://product-service:4002
    depends_on:
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4003/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cart-service.rule=PathPrefix(`/api/cart`)"
      - "traefik.http.routers.cart-service.entrypoints=web"
      - "traefik.http.services.cart-service.loadbalancer.server.port=4003"

  # ─────────────────────────────────────────────
  # 5. Order Service (Port 4004)
  # ─────────────────────────────────────────────
  order-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/order-service
    container_name: electrobyte-order
    restart: unless-stopped
    networks:
      - electrobyte-net
    ports:
      - "4004:4004"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4004
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - CART_SERVICE_URL=http://cart-service:4003
    depends_on:
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4004/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.order-service.rule=PathPrefix(`/api/orders`) || PathPrefix(`/api/user/orders`)"
      - "traefik.http.routers.order-service.entrypoints=web"
      - "traefik.http.services.order-service.loadbalancer.server.port=4004"

  # ─────────────────────────────────────────────
  # 6. Admin Service (Port 4005)
  # ─────────────────────────────────────────────
  admin-service:
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE_DIR: services/admin-service
    container_name: electrobyte-admin-api
    restart: unless-stopped
    networks:
      - electrobyte-net
    ports:
      - "4005:4005"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4005
      - AUTH_SERVICE_URL=http://auth-service:4001
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - ORDER_SERVICE_URL=http://order-service:4004
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-service.rule=PathPrefix(`/api/admin`)"
      - "traefik.http.routers.admin-service.entrypoints=web"
      - "traefik.http.services.admin-service.loadbalancer.server.port=4005"

  # ─────────────────────────────────────────────
  # 7. Frontend Storefront (Next.js — Port 3000)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: electrobyte-frontend
    restart: unless-stopped
    networks:
      - electrobyte-net
    env_file:
      - ./frontend/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AUTH_TRUST_HOST=true
      # Service URLs for Next.js server-side calls (docker internal network)
      - AUTH_SERVICE_URL=http://auth-service:4001
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - CART_SERVICE_URL=http://cart-service:4003
      - ORDER_SERVICE_URL=http://order-service:4004
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  # ─────────────────────────────────────────────
  # 8. Admin Panel (Vite + React — Port 5000)
  # ─────────────────────────────────────────────
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: electrobyte-admin
    restart: unless-stopped
    networks:
      - electrobyte-net
    ports:
      - "5000:80"
    depends_on:
      - admin-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.localhost`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.services.admin.loadbalancer.server.port=80"

volumes:
  minio_data:
    driver: local
