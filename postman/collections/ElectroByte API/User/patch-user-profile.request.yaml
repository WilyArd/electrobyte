$kind: http-request
method: PATCH
url: '{{auth_service_url}}/api/user/profile'
order: 2000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{user_token}}'
body:
  type: json
  content: |-
    {
      "name": "Updated Demo User",
      "image": "https://example.com/avatar.png",
      "language": "en",
      "region": "ID"
    }
