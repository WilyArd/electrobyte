$kind: http-request
method: POST
url: '{{product_service_url}}/api/admin/products'
order: 6000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{admin_token}}'
body:
  type: json
  content: |-
    {
      "name": "Sample Product",
      "description": "This is a sample product description.",
      "price": 199999,
      "image": "https://example.com/product.png",
      "category": "ACCESSORIES",
      "stock": 10,
      "featured": true
    }
