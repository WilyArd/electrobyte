$kind: http-request
method: PUT
url: '{{product_service_url}}/api/admin/products/{{product_id}}'
order: 7000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{admin_token}}'
body:
  type: json
  content: |-
    {
      "name": "Updated Product",
      "description": "Updated sample product description.",
      "price": 249999,
      "image": "https://example.com/product-updated.png",
      "category": "ACCESSORIES",
      "stock": 15,
      "featured": false
    }
