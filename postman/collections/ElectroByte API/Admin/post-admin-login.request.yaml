$kind: http-request
method: POST
url: '{{admin_service_url}}/api/admin/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{admin_email}}",
      "password": "{{admin_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 200 && json?.token) {
        pm.collectionVariables.set('admin_token', json.token);
      }
      if (pm.response.code === 200 && json?.user?.id) {
        pm.collectionVariables.set('user_id', json.user.id);
      }
