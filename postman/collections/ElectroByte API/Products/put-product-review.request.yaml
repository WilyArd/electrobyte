$kind: http-request
method: PUT
url: '{{product_service_url}}/api/products/{{product_id}}/reviews/{{review_id}}'
order: 10000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{user_token}}'
body:
  type: json
  content: |-
    {
      "rating": 4,
      "comment": "Updated review after more usage."
    }
