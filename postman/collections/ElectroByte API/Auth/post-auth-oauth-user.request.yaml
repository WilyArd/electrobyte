$kind: http-request
method: POST
url: '{{auth_service_url}}/api/auth/oauth-user'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "oauth-user@example.com",
      "name": "OAuth User",
      "image": "https://example.com/avatar.png"
    }
