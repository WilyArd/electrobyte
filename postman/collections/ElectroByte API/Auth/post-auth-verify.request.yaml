$kind: http-request
method: POST
url: '{{auth_service_url}}/api/auth/verify'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{user_email}}",
      "password": "{{user_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      if (pm.response.code === 200 && json?.id) {
        pm.collectionVariables.set('user_id', json.id);
      }
