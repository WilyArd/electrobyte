$kind: collection
description: |-
  Complete API collection for ElectroByte e-commerce microservices.

  ## Setup
  1. Set `base_url_auth` = http://localhost:4001
  2. Set `base_url_product` = http://localhost:4002
  3. Set `base_url_cart` = http://localhost:4003
  4. Set `base_url_order` = http://localhost:4004
  5. Set `base_url_admin` = http://localhost:4005

  After login, the `token` variable will be auto-set by the login request's test script.
variables:
  base_url_auth: http://localhost:4001
  base_url_product: http://localhost:4002
  base_url_cart: http://localhost:4003
  base_url_order: http://localhost:4004
  base_url_admin: http://localhost:4005
  token: ""
